<html>
    <body>
        <link rel="stylesheet" href="style.css">
        <h1 id="actiontitle">Focus Timer</h1>
        <div id="maincontainer">
            <div id="timerdiv">
                <span id="timedisplay">00:00</span>
            </div>
            <div class="buttondiv">
                <button id="startbutton" class="mainbutton">Start Timer</button>
            </div>
            <div class="buttondiv">
                <button id="pausebutton" class="mainbutton">Pause Timer</button>
            </div>
            <div class="buttondiv">
                <button id="resumebutton" class="mainbutton">Resume Timer</button>
            </div>
            <div class="buttondiv">
                <button id="resetbutton" class="mainbutton">Reset Timer</button>
            </div>
            <div class="buttondiv">
                <button id="settingsbutton" class="mainbutton"><a href="settings.html">Settings</a></button>
            </div>
        </div>
        <script src="popup.js" type="module"></script>
    </body>
</html>
